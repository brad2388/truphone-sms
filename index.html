<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Truphone SMS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SIM SMS">
<meta name="theme-color" content="#111418">
<style>
  :root { color-scheme: dark light; --bg:#111418; --card:#1b2027; --line:#2c333d; --fg:#e8ecf1; --mut:#8b95a3; --acc:#3b82f6; --ok:#22c55e; --bad:#ef4444; }
  @media (prefers-color-scheme: light) { :root { --bg:#f3f5f8; --card:#fff; --line:#d9dee5; --fg:#141a22; --mut:#5d6877; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px -apple-system, system-ui, sans-serif;
         padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 4px 0 14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; }
  label { display:block; font-size:13px; color:var(--mut); margin:10px 0 4px; }
  label:first-child { margin-top:0; }
  input, textarea, select { width:100%; font:inherit; color:var(--fg); background:transparent; border:1px solid var(--line); border-radius:10px; padding:11px; }
  textarea { min-height: 110px; resize: vertical; }
  button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:12px 16px; background:var(--acc); color:#fff; width:100%; margin-top:12px; }
  button.sec { background:transparent; color:var(--fg); border:1px solid var(--line); }
  button:disabled { opacity:.5; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip { border:1px solid var(--line); border-radius:999px; padding:7px 11px; font-size:14px; background:transparent; color:var(--fg); width:auto; margin:0; font-weight:500; }
  .chip.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  .msg { font-size:14px; margin-top:10px; word-break:break-word; white-space:pre-wrap; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  .hist { font-size:14px; border-top:1px solid var(--line); padding:10px 0; }
  .hist:first-child { border-top:0; }
  .hist .m { color:var(--mut); font-size:12px; }
  details summary { cursor:pointer; color:var(--mut); font-size:14px; }
  small { color:var(--mut); }
</style>
</head>
<body>
<main>
  <h1>Truphone SMS</h1>

  <div class="card">
    <label for="msg">Message</label>
    <textarea id="msg" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Text to send to the selected SIMs"></textarea>

    <label>Send to</label>
    <div class="chips" id="chips"></div>
    <small id="none" style="display:none">No SIMs saved yet. Add ICCIDs in Settings below.</small>

    <button id="send">Send SMS</button>
    <div class="msg" id="out"></div>
  </div>

  <div class="card">
    <div class="row" style="align-items:center;justify-content:space-between;display:flex">
      <strong>Recent messages</strong>
    </div>
    <div id="hist"><small>Tap Refresh to load.</small></div>
    <button class="sec" id="refresh">Refresh</button>
  </div>

  <details class="card" id="settings">
    <summary>Settings</summary>
    <label for="token">API token</label>
    <input id="token" type="password" autocomplete="off" autocapitalize="off" placeholder="from Truphone portal &gt; Settings">
    <label for="base">API base URL</label>
    <input id="base" autocapitalize="off" value="https://iot.truphone.com/api/v2.0">
    <label for="iccids">SIMs (one per line: ICCID, optional label after a comma)</label>
    <textarea id="iccids" autocapitalize="off" placeholder="89440000000000000001, Site A router&#10;89440000000000000002, Site B router"></textarea>
    <button class="sec" id="pull">Load SIMs from my account</button>
    <button id="save">Save</button>
    <div class="msg" id="saved"></div>
    <p><small>Stored only in this browser on this device.</small></p>
  </details>
</main>

<script>
const $ = id => document.getElementById(id);
const K = 'truphone-sms-v1';
let cfg = { token:'', base:'https://iot.truphone.com/api/v2.0', sims:[], sel:[] };

function load() {
  try { Object.assign(cfg, JSON.parse(localStorage.getItem(K) || '{}')); } catch (e) {}
  $('token').value = cfg.token;
  $('base').value = cfg.base;
  $('iccids').value = cfg.sims.map(s => s.label ? `${s.iccid}, ${s.label}` : s.iccid).join('\n');
  if (!cfg.token) $('settings').open = true;
  renderChips();
}
function persist() { try { localStorage.setItem(K, JSON.stringify(cfg)); } catch (e) {} }

function renderChips() {
  const box = $('chips'); box.innerHTML = '';
  $('none').style.display = cfg.sims.length ? 'none' : 'block';
  cfg.sims.forEach(s => {
    const b = document.createElement('button');
    b.className = 'chip' + (cfg.sel.includes(s.iccid) ? ' on' : '');
    b.textContent = s.label || ('…' + s.iccid.slice(-6));
    b.onclick = () => {
      cfg.sel = cfg.sel.includes(s.iccid) ? cfg.sel.filter(x => x !== s.iccid) : [...cfg.sel, s.iccid];
      persist(); renderChips();
    };
    box.appendChild(b);
  });
}

$('save').onclick = () => {
  cfg.token = $('token').value.trim();
  cfg.base = $('base').value.trim().replace(/\/+$/, '');
  cfg.sims = $('iccids').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const i = l.indexOf(',');
    return i < 0 ? { iccid: l, label: '' } : { iccid: l.slice(0, i).trim(), label: l.slice(i + 1).trim() };
  }).filter(s => s.iccid);
  cfg.sel = cfg.sel.filter(x => cfg.sims.some(s => s.iccid === x));
  persist(); renderChips();
  $('saved').innerHTML = '<span class="ok">Saved.</span>';
};

async function api(path, opts = {}) {
  const res = await fetch(cfg.base + path, {
    ...opts,
    headers: { 'Authorization': 'Token ' + cfg.token, 'Content-Type': 'application/json', ...(opts.headers || {}) }
  });
  const text = await res.text();
  let data; try { data = JSON.parse(text); } catch (e) { data = text; }
  if (!res.ok) throw new Error(`HTTP ${res.status}: ${typeof data === 'string' ? data.slice(0, 300) : JSON.stringify(data)}`);
  return data;
}

function netErr(e) {
  return (e instanceof TypeError)
    ? 'Network error. This is usually CORS (the API blocking browser calls) or no connection. If it persists, set API base URL to a proxy you host.'
    : e.message;
}

$('send').onclick = async () => {
  const text = $('msg').value; // sent exactly as typed: leading spaces matter for device commands
  const out = $('out');
  if (!cfg.token) { out.innerHTML = '<span class="bad">Add your API token in Settings.</span>'; return; }
  if (!cfg.sel.length) { out.innerHTML = '<span class="bad">Select at least one SIM.</span>'; return; }
  if (!text.trim()) { out.innerHTML = '<span class="bad">Enter a message.</span>'; return; }
  $('send').disabled = true; out.textContent = 'Sending…';
  try {
    // No Idempotency-Key header: a custom header can fail the browser's CORS preflight.
    const r = await api('/sims/send_sms/', {
      method: 'POST',
      body: JSON.stringify({ iccid: cfg.sel, text })
    });
    out.innerHTML = '<span class="ok">Sent to ' + cfg.sel.length + ' SIM(s).</span>\n' + (typeof r === 'string' ? r : JSON.stringify(r));
    $('msg').value = '';
    setTimeout(loadHist, 1500);
  } catch (e) {
    out.innerHTML = '<span class="bad">' + netErr(e).replace(/</g, '&lt;') + '</span>';
  } finally { $('send').disabled = false; }
};

async function loadHist() {
  const box = $('hist');
  if (!cfg.token) { box.innerHTML = '<small>Add your token in Settings.</small>'; return; }
  box.innerHTML = '<small>Loading…</small>';
  try {
    const r = await api('/sims/send_sms/status/?per_page=15');
    const rows = Array.isArray(r) ? r : (r.results || r.data || []);
    if (!rows.length) { box.innerHTML = '<small>No messages.</small>'; return; }
    const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    box.innerHTML = rows.map(x => `<div class="hist">${esc(x.content || x.text || '')}
      <div class="m">${esc(x.iccid || '')} · ${esc(x.deliveryStatus || x.delivery_status || x.status || '')} · ${esc(x.dateSubmitted || '')}</div></div>`).join('');
  } catch (e) {
    box.innerHTML = '<span class="bad">' + netErr(e).replace(/</g, '&lt;') + '</span>';
  }
}
// Pull every SIM (ICCID + label) from the account and fill the list.
$('pull').onclick = async () => {
  const note = $('saved');
  cfg.token = $('token').value.trim();
  cfg.base = $('base').value.trim().replace(/\/+$/, '');
  if (!cfg.token) { note.innerHTML = '<span class="bad">Enter your API token first.</span>'; return; }
  $('pull').disabled = true; note.textContent = 'Loading SIMs…';
  try {
    const found = [];
    let path = '/sims/?per_page=100&ordering=label';
    for (let guard = 0; path && guard < 50; guard++) {
      const r = await api(path);
      const rows = Array.isArray(r) ? r : (r.results || r.data || []);
      rows.forEach(s => { if (s && s.iccid) found.push({ iccid: String(s.iccid), label: s.label || '' }); });
      // follow "next" if the API paginates with a full URL; otherwise page by number
      if (!Array.isArray(r) && r.next) {
        const u = new URL(r.next, location.href);
        path = u.pathname.replace(/^.*\/api\/v[\d.]+/, '') + u.search;
      } else if (rows.length >= 100) {
        const m = path.match(/page=(\d+)/);
        const n = m ? +m[1] + 1 : 2;
        path = '/sims/?per_page=100&ordering=label&page=' + n;
      } else path = null;
    }
    if (!found.length) { note.innerHTML = '<span class="bad">No SIMs returned.</span>'; return; }
    const seen = new Set();
    cfg.sims = found.filter(s => !seen.has(s.iccid) && seen.add(s.iccid));
    cfg.sel = cfg.sel.filter(x => seen.has(x));
    $('iccids').value = cfg.sims.map(s => s.label ? `${s.iccid}, ${s.label}` : s.iccid).join('\n');
    persist(); renderChips();
    note.innerHTML = `<span class="ok">Loaded ${cfg.sims.length} SIM(s) and saved.</span>`;
  } catch (e) {
    note.innerHTML = '<span class="bad">' + netErr(e).replace(/</g, '&lt;') + '</span>';
  } finally { $('pull').disabled = false; }
};
$('refresh').onclick = loadHist;
load();
</script>
</body>
</html>
